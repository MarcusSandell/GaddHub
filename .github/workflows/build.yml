
name: Build Gadda

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Gadda-Windows
            upload_path: dist/Gadda.exe

          - os: ubuntu-24.04
            artifact: Gadda-Linux
            upload_path: Gadda-Linux-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --clean --name Gadda main.py

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf Gadda-Linux-x86_64.tar.gz -C dist Gadda

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          compression-level: 0
          if-no-files-found: error
